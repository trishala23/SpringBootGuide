site_name: Spring Boot Guide
site_description: A beginner-friendly, hands-on tutorial for learning Spring Boot from scratch.
repo_url: https://github.com/trishala23/SpringBootGuide
repo_name: trishala23/SpringBootGuide
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Lessons:
      - 1. What is Spring Boot & why use it: lessons/01-what-is-spring-boot.md
      - 2. Setting up your environment: lessons/02-setting-up-environment.md
      - 3. Your first Spring Boot app: lessons/03-first-app-hello-world.md
      - 4. Understanding project structure: lessons/04-project-structure.md
      - 5. Building a REST API: lessons/05-rest-api.md
