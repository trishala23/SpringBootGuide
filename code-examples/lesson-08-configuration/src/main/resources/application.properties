spring.application.name=demo

# Custom application settings (see Lesson 8's AppProperties/GreetingController).
app.greeting=Welcome to the Task API!
app.max-tasks=100

# Give the in-memory H2 database a fixed name so the connection is
# predictable, and keep it alive for the whole app run (not just one
# connection).
spring.datasource.url=jdbc:h2:mem:tasksdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update" makes Hibernate create/update database tables to match your
# @Entity classes automatically - convenient for learning. Never use
# this in a real production app (see the note in the lesson).
spring.jpa.hibernate.ddl-auto=update

# Turns on a web-based database viewer at /h2-console - handy for
# beginners to see the actual rows without writing SQL by hand.
spring.h2.console.enabled=true
